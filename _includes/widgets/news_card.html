{% assign recent_news = site.data.news | sort: "date" | reverse | slice: 0, include.limit -%}

<div class="my-3 bg-white shadow-sm rounded-xl">
    <h2 class="h6 p-3 mb-0 border-bottom border-gray"><i class="fas fa-rss"></i> News</h2>
    <div class="news-list small" aria-label="Recent news">
        {% for item in recent_news %}
        <div class="news-item{% unless forloop.first %} border-top border-gray{% endunless %}">
            <div class="news-date">
                {% if item.display_date %}{{ item.display_date }}{% else %}{{ item.date | date: "%b %Y" }}{% endif %}
            </div>
            <div class="news-title">{{ item.title }}</div>
        </div>
        {% endfor %}
    </div>
</div>
