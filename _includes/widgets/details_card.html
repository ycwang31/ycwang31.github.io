<div class="row mt-3">
  <div class="col">
    <div class="card border-0 shadow-sm bg-white">
      <div class="card-body p-4">
        <h2 class="h6 details-heading"><i class="fas fa-compass"></i> Research Interests</h2>
        <div class="row interest-grid">
          {% for item in site.data.profile.research_interests %}
          <div class="col-lg-4 mb-3 mb-lg-0">
            <div class="interest-item h-100">
              <h3 class="h6 interest-title">
                <i class="{{ item.icon }}" aria-hidden="true"></i>
                <span>{{ item.name }}</span>
              </h3>
              <div class="small text-muted">{{ item.description }}</div>
            </div>
          </div>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
</div>
