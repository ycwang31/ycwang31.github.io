<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<!-- Template: https://github.com/luost26/academic-homepage -->
<head>
  {% assign meta_description = page.description | default: site.description %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="{{ meta_description | strip_html | normalize_whitespace | escape }}">
  <meta name="author" content="{{ site.data.profile.primary_name }}">
  <meta name="robots" content="{{ page.robots | default: 'index, follow, max-image-preview:large' }}">
  <meta name="theme-color" content="#f8f9fa">
  <meta name="google-site-verification" content="tQif6u8rXqujX1BFi53VaoMnl_zsZuVtwolkB4XrWBA">

  <title>{{ page.title }} - {{ site.data.profile.navbar_name }}</title>
  <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
  <link rel="icon" href="{{ '/images/favicon/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/images/favicon/favicon-16x16.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/images/favicon/apple-touch-icon.png' | relative_url }}">

  <meta property="og:type" content="{{ page.og_type | default: 'website' }}">
  <meta property="og:title" content="{{ page.title }} - {{ site.data.profile.navbar_name }}">
  <meta property="og:description" content="{{ meta_description | strip_html | normalize_whitespace | escape }}">
  <meta property="og:url" content="{{ page.url | replace: 'index.html', '' | absolute_url }}">
  <meta property="og:image" content="{{ site.data.profile.portrait_url | absolute_url }}">
  <meta property="og:image:alt" content="Portrait of {{ site.data.profile.primary_name }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ page.title }} - {{ site.data.profile.navbar_name }}">
  <meta name="twitter:description" content="{{ meta_description | strip_html | normalize_whitespace | escape }}">
  <meta name="twitter:image" content="{{ site.data.profile.portrait_url | absolute_url }}">

  {% if page.profile_page %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfilePage",
    "url": {{ site.url | append: site.baseurl | append: '/' | jsonify }},
    "name": "Yongcong Wang - Academic Homepage",
    "dateModified": {{ site.last_updated_iso | jsonify }},
    "mainEntity": {
      "@type": "Person",
      "name": {{ site.data.profile.primary_name | jsonify }},
      "alternateName": ["王勇聪", "ycwang31"],
      "url": {{ site.url | append: site.baseurl | append: '/' | jsonify }},
      "image": {{ site.data.profile.portrait_url | absolute_url | jsonify }},
      "email": "mailto:ycwang1031@gmail.com",
      "jobTitle": "Master's Student and Computer Vision Researcher",
      "affiliation": {
        "@type": "CollegeOrUniversity",
        "name": "Central South University",
        "url": "https://www.csu.edu.cn/"
      },
      "alumniOf": {
        "@type": "CollegeOrUniversity",
        "name": "Nanjing Forestry University",
        "url": "https://www.njfu.edu.cn/"
      },
      "knowsAbout": ["Computer Vision", "AIGC", "Multimodal Large Language Models", "Visual Generation", "Remote Sensing", "Image Quality Assessment"],
      "sameAs": [
        "https://github.com/ycwang31",
        "https://scholar.google.com.hk/citations?user=t7rdVLoAAAAJ&hl=zh-CN",
        "https://www.linkedin.com/in/%E5%8B%87%E8%81%AA-%E7%8E%8B-b9b3602ba/",
        "https://openreview.net/profile?id=%7EYongcong_Wang1"
      ]
    }
  }
  </script>
  {% endif %}

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/css/bootstrap.min.css" integrity="sha512-P5MgMn1jBN01asBgU0z60Qk4QxiXo86+wlFahKrsQf37c9cro517WzVSPPV1tDKzhku2iJ2FVgL67wG03SGnNA==" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.1/css/academicons.min.css" integrity="sha512-b1ASx0WHgVFL5ZQhTgiPWX+68KjS38Jk87jg7pe+qC7q9YkEtFq0z7xCglv7qGIs/68d3mAp+StfC8WKC5SSAg==" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ '/assets/css/global.css' | relative_url }}">
</head>
<body class="bg-light" {{ page.body_attr }}>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  {% include navbar.html %}
  <main id="main-content" class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
    {{ content }}
  </main>
  {% include footer.html %}

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.lazy/1.7.9/jquery.lazy.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/js/bootstrap.min.js" integrity="sha512-XKa9Hemdy1Ui3KSGgJdgMyYlUg1gM+QhL6cnlyTe2qzMCYm4nAZ1PsVerQzTTXzonUR+dmswHqgJPuwCq1MaAg==" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js"></script>
  <script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (typeof renderMathInElement === "function") {
        renderMathInElement(document.body, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false }
          ],
          throwOnError: false
        });
      }
    });
  </script>
  <script src="{{ '/assets/js/common.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/bubble_visual_hash.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/semantic_scholar_citation_count.js' | relative_url }}"></script>
</body>
</html>
