# All publications live here in one place — add or remove entries as needed.
# Order doesn't matter; the site sorts by `date` and groups by year automatically.
#
# Fields:
#   id        (required) unique slug, used as a fallback cover placeholder
#   title     (required)
#   date      (required) YYYY-MM-DD HH:MM:SS +0800 — controls sort order
#   selected  (optional) true to show on the homepage "Selected Publications" list
#   cover     (optional) path to a cover image under /images/paper/
#   pub       (optional) venue name, e.g. "IEEE GRSL" or "arXiv preprint"
#   pub_post  (optional) text right after the venue, e.g. " · Under review"
#   pub_date  (optional) year/date text shown after the venue
#   pub_last  (optional) trailing HTML, e.g. a badge span
#   abstract  (optional)
#   authors   (required) list of author keys (see _data/authors.yml); append
#             "*" for equal contribution or "#" for corresponding author
#   links     (optional) map of label -> URL, e.g. Paper, Code, Dataset

