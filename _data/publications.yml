# All publications live here in one place — add or remove entries as needed.
# Order doesn't matter; the site groups by `year` and sorts by `date` automatically.
#
# Fields:
#   id        (required) unique slug, used as a fallback cover placeholder
#   title     (required)
#   date      (required) YYYY-MM-DD HH:MM:SS +0800 — controls order within a year
#   year      (required) groups the paper under this year on the Publications page
#   selected  (optional) true to show on the homepage "Selected Publications" list
#   cover     (optional) path to a cover image under /images/paper/
#   pub       (optional) venue shown in red italics, e.g. "NeurIPS 2026" or "arXiv preprint"
#   status    (optional) shown after the venue as "venue · status", e.g. "Under review"
#   rank      (optional) venue ratings shown as tags after the venue line,
#             e.g. [CCF-A] or [CCF-B, JCR Q1]; leave as [] to show nothing
#   badge     (optional) full label on the cover's top-left corner, e.g. "NeurIPS 2026"
#   abstract  (optional)
#   authors   (required) list of author keys (see _data/authors.yml); append
#             "*" for equal contribution or "#" for corresponding author
#   bibtex    (optional) BibTeX entry; adds a BibTeX button with a copy action
#   links     (optional) map of label -> URL, e.g. Paper, Code, Dataset;
#             leave the URL empty (e.g. "Paper:") to show an unlinked button

